      <stop offset="0" stop-color="#0a2f2c"/>
      <stop offset="1" stop-color="#0f5c55"/>
    </linearGradient>
  </defs>
  <rect width="960" height="320" fill="url(#bg)"/>
  <rect x="72" y="70" width="180" height="180" rx="36" fill="#e8f6f3"/>
  <g transform="translate(72 70) scale(1.5)">
    <rect x="34" y="16" width="64" height="84" rx="12" fill="#bfe6df" stroke="#0f5c55" stroke-width="5" transform="rotate(10 66 58)"/>
    <rect x="22" y="22" width="64" height="84" rx="12" fill="#ffffff" stroke="#0f5c55" stroke-width="5" transform="rotate(-6 54 64)"/>
