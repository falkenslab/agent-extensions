name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Claude Code's own validator, strict: a warning fails too. userConfig's `options` needs 2.1.271 or later.
      - run: npm install --global @anthropic-ai/claude-code@latest
      - name: The catalog is up to date
        run: npx -y @falkenslab/agent-kit-catalog@0.7.0 --check
      - name: The marketplace
        run: claude plugin validate --strict .
      # Every tool a manifest, a skill or a command names exists in its pinned server and role; readOnlyTools
      # keeps up with the server's readOnlyHint. Starts each local server for its tools/list only.
      # The servers in mcps/, published to npm one by one: built and tested, and each extension still carries
      # the build its .mcp.json runs (dist/server.mjs, copied by the build until it runs from npm).
      - name: The servers in mcps/
        run: |
          for dir in mcps/*/; do
            echo "::group::$dir"
            (cd "$dir" && npm ci --no-audit --no-fund && npm run build && npm test)
            echo "::endgroup::"
          done
          git diff --exit-code -- extensions/*/dist/
      - name: The tools they name
        run: node scripts/check-tools.mjs
      - name: Each extension
        run: |
          for plugin in extensions/*/.claude-plugin/plugin.json; do
            dir="$(dirname "$(dirname "$plugin")")"
            echo "::group::$dir"
            claude plugin validate --strict "$dir"
            echo "::endgroup::"
          done
