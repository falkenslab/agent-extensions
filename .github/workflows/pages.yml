name: pages

# The public site: site/ (the home page and the catalog page) and catalog.json, on GitHub Pages
# (falkenslab.github.io/agent-extensions). Pages must use "GitHub Actions" as its source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @falkenslab/agent-kit-catalog@0.7.0 --check
      - run: |
          mkdir -p _site
          cp site/* catalog.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
