<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falken's Lab extensions</title>
<meta name="description" content="Extensions for agents built on agent-kit, and plugins for Claude Code: search them by name or topic.">
<style>
  :root {
    --bg: #f7f5f0; --panel: #ffffff; --line: #e4dfd3; --text: #1d2433; --text-2: #4a5468; --dim: #7a7f8c;
    --accent: #c2410c; --accent-ink: #ffffff; --chip: #f1ece2; --shadow: 0 8px 30px rgba(30, 30, 30, 0.08);
    --sans: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --panel: #151b24; --line: #263040; --text: #e8edf4; --text-2: #b4bfcf; --dim: #7f8ca0; --accent: #f98012; --accent-ink: #1a0d02; --chip: #1c2533; --shadow: 0 8px 30px rgba(0, 0, 0, 0.4); }
  }
  * { box-sizing: border-box; }
  /* The footer at the very bottom, however short the page: the body is a column at least as tall as the window. */
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; }
  main { flex: 1 0 auto; width: 100%; max-width: 1120px; margin: 0 auto; padding: 40px 16px 24px; }
  .bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .langs { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); flex: none; }
  .lang { font: inherit; font-size: 13px; border: 0; background: none; color: var(--text-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .lang[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  header h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 36px); }
  header p { margin: 0 0 18px; color: var(--text-2); max-width: 720px; }
  header a { color: var(--accent); }
  .add { margin-bottom: 26px; }
  .tabs { display: grid; gap: 10px; min-width: 0; }
  .tablist { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--dim); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab svg { width: 18px; height: 18px; flex: none; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabpanel { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
  code.cmd { font-family: var(--mono); font-size: 13px; background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: inline-flex; gap: 10px; align-items: center; max-width: 100%; overflow-x: auto; white-space: nowrap; }
  .copy { font: inherit; font-size: 12px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
  .search { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 20px; }
  .chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text-2); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; box-shadow: var(--shadow); }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
  .top { display: flex; gap: 12px; align-items: center; }
  .logo { width: 48px; height: 48px; border-radius: 12px; flex: none; object-fit: contain; }
  .logo.initial { display: grid; place-items: center; background: var(--chip); color: var(--text-2); font-weight: 700; font-size: 20px; }
  .name { font-weight: 650; font-size: 17px; } .ver { color: var(--dim); font-size: 13px; font-weight: 400; margin-left: 6px; }
  .desc { color: var(--text-2); font-size: 14px; margin: 0; }
  .card .desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; } .tag { font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .empty { color: var(--dim); }
  dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(860px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  /* The extension's README, rendered in the dialog as its detailed description. */
  .readme { border-top: 1px solid var(--line); padding-top: 12px; color: var(--text); font-size: 15px; overflow-wrap: anywhere; }
  .readme.loading, .readme.missing { color: var(--dim); font-size: 14px; }
  .readme h1, .readme h2, .readme h3 { line-height: 1.25; margin: 1.3em 0 0.5em; } .readme h1 { font-size: 22px; } .readme h2 { font-size: 19px; } .readme h3 { font-size: 16px; }
  .readme > :first-child { margin-top: 0.4em; }
  .readme p, .readme ul, .readme ol { margin: 0.6em 0; } .readme li { margin: 0.25em 0; }
  .readme a { color: var(--accent); }
  .readme code { font-family: var(--mono); font-size: 13px; background: var(--chip); border-radius: 5px; padding: 1px 5px; }
  .readme pre { background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
  .readme pre code { background: none; padding: 0; }
  .readme table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; margin: 0.8em 0; }
  .readme th, .readme td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .readme th { background: var(--chip); }
  .readme img { max-width: 100%; height: auto; }
  .caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
  .cap { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
  .cap strong { display: block; font-size: 14px; } .cap span { display: block; color: var(--text-2); font-size: 13px; line-height: 1.4; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog .banner { width: 100%; display: block; aspect-ratio: 3 / 1; object-fit: cover; }
  dialog .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
  dialog h2 { margin: 0; font-size: 22px; }
  dialog .install { display: flex; flex-direction: column; gap: 6px; } dialog .label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.6px; }
  dialog .links { display: flex; gap: 14px; flex-wrap: wrap; } dialog a { color: var(--accent); }
  dialog .close { align-self: flex-end; font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 10px; padding: 6px 14px; cursor: pointer; }
  footer { flex: none; text-align: center; color: var(--dim); padding: 30px 16px 40px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="bar">
      <h1 id="title">Falken's Lab extensions</h1>
      <div class="langs" id="langs" role="group" aria-label="Language">
        <button class="lang" type="button" data-lang="en" lang="en">EN</button>
        <button class="lang" type="button" data-lang="es" lang="es">ES</button>
      </div>
    </div>
    <p id="intro"></p>
    <div class="add" id="add"></div>
  </header>
  <input class="search" id="search" type="search">
  <div class="chips" id="chips" role="group"></div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<dialog id="details" aria-labelledby="details-title"></dialog>
<footer>Made with 💖 by Falken's Lab Team</footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const escape = (text) => String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const params = new URLSearchParams(location.search);
// ?topic=miyagi (several, comma-separated): an agent links to the extensions it offers.
const chosen = new Set((params.get("topic") ?? "").split(",").map((topic) => topic.trim().toLowerCase()).filter(Boolean));
let catalog = { extensions: [] };
let failed = false;

// The page's own texts in English and Spanish. The extensions' descriptions come from catalog.json, in English.
const TEXTS = {
  en: {
    title: "Falken's Lab extensions",
    description: "Extensions for agents built on agent-kit, and plugins for Claude Code: search them by name or topic.",
    intro: `Extensions for agents built on <a href="https://github.com/falkenslab/agent-kit">agent-kit</a>, and plugins for Claude Code and Codex: the same folder for all. Add the marketplace, then install what you need.`,
    search: "Search by name, description or topic…",
    searchLabel: "Search extensions",
    topics: "Topics",
    language: "Language",
    copy: "Copy",
    copied: "Copied",
    none: "No extension matches.",
    failed: "The catalog couldn't be loaded.",
    agent: "An agent on agent-kit",
    source: "Source",
    close: "Close",
    capabilities: "Capabilities",
    readmeLoading: "Loading the README…",
    readmeMissing: "The README couldn't be loaded.",
  },
  es: {
    title: "Extensiones de Falken's Lab",
    description: "Extensiones para agentes hechos con agent-kit, y plugins para Claude Code: búscalas por nombre o por tema.",
    intro: `Extensiones para agentes hechos con <a href="https://github.com/falkenslab/agent-kit">agent-kit</a>, y plugins para Claude Code y Codex: la misma carpeta para todos. Añade el marketplace e instala lo que necesites.`,
    search: "Busca por nombre, descripción o tema…",
    searchLabel: "Buscar extensiones",
    topics: "Temas",
    language: "Idioma",
    copy: "Copiar",
    copied: "Copiado",
    none: "Ninguna extensión coincide.",
    failed: "No se ha podido cargar el catálogo.",
    agent: "Un agente con agent-kit",
    source: "Código",
    close: "Cerrar",
    capabilities: "Capacidades",
    readmeLoading: "Cargando el README…",
    readmeMissing: "No se ha podido cargar el README.",
  },
};
// ?lang=es, else what the person chose last time, else the browser's language.
function stored() {
  try { return localStorage.getItem("lang"); } catch { return null; }
}
function pickLang() {
  for (const lang of [params.get("lang"), stored(), ...(navigator.languages ?? [navigator.language])]) {
    const short = String(lang ?? "").slice(0, 2).toLowerCase();
    if (short in TEXTS) return short;
  }
  return "en";
}
let lang = pickLang();
const t = (key) => TEXTS[lang][key];

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelector('meta[name="description"]').content = t("description");
  $("title").textContent = t("title");
  $("intro").innerHTML = t("intro");
  $("search").placeholder = t("search");
  $("search").setAttribute("aria-label", t("searchLabel"));
  $("chips").setAttribute("aria-label", t("topics"));
  $("langs").setAttribute("aria-label", t("language"));
  for (const button of document.querySelectorAll(".lang")) button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
}
for (const button of document.querySelectorAll(".lang")) {
  button.addEventListener("click", () => {
    lang = button.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch {}
    const url = new URL(location.href);
    url.searchParams.set("lang", lang);
    history.replaceState(null, "", url);
    applyLang();
    renderAdd();
    renderGrid();
    if ($("details").open && openExtension) openDetails(openExtension);
  });
}
let openExtension = null;

// Served from the repository locally (site/ next to catalog.json), images from the files there.
const local = ["localhost", "127.0.0.1"].includes(location.hostname);
const asset = (url) => (local && url ? url.replace(/^https:\/\/raw\.githubusercontent\.com\/[^/]+\/[^/]+\/main\//, "../") : url);

// The three clients, always in this order: Claude Code, Codex, an agent on agent-kit. The chosen tab is remembered.
const LOGOS = {
  claude: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#d97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>`,
  codex: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>`,
  agentKit: `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="10" width="22" height="22" rx="6" fill="#2e3a8c"/><rect x="6" y="36" width="22" height="22" rx="6" fill="#4453b8"/><rect x="32" y="36" width="22" height="22" rx="6" fill="#6272de"/><rect x="37" y="5" width="22" height="22" rx="6" fill="#ff6b57"/></svg>`,
};
let chosenClient = (() => { try { return localStorage.getItem("client") || "claude"; } catch { return "claude"; } })();
let tabsCount = 0;
function clientTabs(clients) {
  const id = `tabs${++tabsCount}`;
  const tabs = document.createElement("div");
  tabs.className = "tabs";
  const list = document.createElement("div");
  list.className = "tablist";
  list.setAttribute("role", "tablist");
  const panel = document.createElement("div");
  panel.className = "tabpanel";
  panel.id = `${id}-panel`;
  panel.setAttribute("role", "tabpanel");
  const buttons = clients.map((client) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "tab";
    button.id = `${id}-${client.logo}`;
    button.setAttribute("role", "tab");
    button.setAttribute("aria-controls", panel.id);
    button.innerHTML = `${LOGOS[client.logo]}${escape(client.label)}`;
    button.addEventListener("click", () => select(client.logo, true));
    return button;
  });
  list.addEventListener("keydown", (event) => {
    const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
    if (!step) return;
    const at = clients.findIndex((client) => client.logo === current);
    const next = clients[(at + step + clients.length) % clients.length];
    select(next.logo, true);
    buttons[clients.indexOf(next)].focus();
  });
  let current;
  function select(logo, remember) {
    const client = clients.find((c) => c.logo === logo) ?? clients[0];
    current = client.logo;
    buttons.forEach((button, i) => {
      const on = clients[i] === client;
      button.setAttribute("aria-selected", String(on));
      button.tabIndex = on ? 0 : -1;
    });
    panel.setAttribute("aria-labelledby", `${id}-${client.logo}`);
    panel.replaceChildren(...client.commands.map(commandBox));
    if (remember) {
      chosenClient = client.logo;
      try { localStorage.setItem("client", chosenClient); } catch {}
    }
  }
  list.append(...buttons);
  tabs.append(list, panel);
  select(chosenClient, false);
  return tabs;
}
function commandBox(text) {
  const box = document.createElement("code");
  box.className = "cmd";
  box.append(text);
  const copy = document.createElement("button");
  copy.className = "copy";
  copy.type = "button";
  copy.textContent = t("copy");
  copy.addEventListener("click", async (event) => {
    event.stopPropagation();
    await navigator.clipboard?.writeText(text);
    copy.textContent = t("copied");
    setTimeout(() => (copy.textContent = t("copy")), 1500);
  });
  box.append(copy);
  return box;
}
function logo(extension, size) {
  if (extension.logo) {
    const img = document.createElement("img");
    img.className = "logo";
    img.alt = "";
    img.src = asset(extension.logo);
    img.style.width = img.style.height = `${size}px`;
    return img;
  }
  const tile = document.createElement("div");
  tile.className = "logo initial";
  tile.style.width = tile.style.height = `${size}px`;
  tile.textContent = extension.name.slice(0, 1).toUpperCase();
  return tile;
}
function renderChips() {
  const topics = [...new Set(catalog.extensions.flatMap((extension) => extension.topics))].sort();
  $("chips").innerHTML = "";
  for (const topic of topics) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = `chip${chosen.has(topic) ? " on" : ""}`;
    chip.textContent = topic;
    chip.setAttribute("aria-pressed", String(chosen.has(topic)));
    chip.addEventListener("click", () => {
      if (chosen.has(topic)) chosen.delete(topic);
      else chosen.add(topic);
      const url = new URL(location.href);
      if (chosen.size) url.searchParams.set("topic", [...chosen].join(","));
      else url.searchParams.delete("topic");
      history.replaceState(null, "", url);
      renderChips();
      renderGrid();
    });
    $("chips").append(chip);
  }
}
function renderGrid() {
  const words = $("search").value.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = catalog.extensions.filter(
    (extension) =>
      [...chosen].every((topic) => extension.topics.includes(topic)) &&
      words.every((word) => `${extension.name} ${extension.description} ${extension.topics.join(" ")}`.toLowerCase().includes(word)),
  );
  if (failed) return void ($("grid").innerHTML = `<p class="empty">${escape(t("failed"))}</p>`);
  $("grid").innerHTML = shown.length ? "" : `<p class="empty">${escape(t("none"))}</p>`;
  for (const extension of shown) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    const top = document.createElement("div");
    top.className = "top";
    top.append(logo(extension, 48));
    top.insertAdjacentHTML("beforeend", `<div class="name">${escape(extension.name)}<span class="ver">${escape(extension.version)}</span></div>`);
    card.append(top);
    card.insertAdjacentHTML("beforeend", `<p class="desc">${escape(extension.description)}</p><div class="tags">${extension.topics.map((topic) => `<span class="tag">${escape(topic)}</span>`).join("")}</div>`);
    card.addEventListener("click", () => openDetails(extension));
    $("grid").append(card);
  }
}
function openDetails(extension) {
  openExtension = extension;
  const dialog = $("details");
  dialog.innerHTML = "";
  if (extension.banner) {
    const banner = document.createElement("img");
    banner.className = "banner";
    banner.alt = "";
    banner.src = asset(extension.banner);
    dialog.append(banner);
  }
  const body = document.createElement("div");
  body.className = "body";
  const top = document.createElement("div");
  top.className = "top";
  top.append(logo(extension, 52));
  top.insertAdjacentHTML("beforeend", `<div><h2 id="details-title">${escape(extension.name)}<span class="ver">${escape(extension.version)}</span></h2><div class="desc">${escape(extension.author ?? "")}${extension.license ? ` · ${escape(extension.license)}` : ""}</div></div>`);
  body.append(top);
  body.insertAdjacentHTML("beforeend", `<p class="desc">${escape(extension.description)}</p><div class="tags">${extension.topics.map((topic) => `<span class="tag">${escape(topic)}</span>`).join("")}</div>`);
  const install = document.createElement("div");
  install.className = "install";
  // Codex reads this marketplace too (.claude-plugin/marketplace.json); catalog.json doesn't list its commands yet.
  install.append(clientTabs([
    { logo: "claude", label: "Claude Code", commands: [extension.install.claudeCode] },
    { logo: "codex", label: "Codex", commands: [`codex plugin add ${extension.name}@${catalog.marketplace}`] },
    { logo: "agentKit", label: t("agent"), commands: [`<agent> ${extension.install.agentKit}`] },
  ]));
  body.append(install);
  body.insertAdjacentHTML("beforeend", `<div class="links"><a href="${escape(extension.readme)}">README</a><a href="${escape(extension.homepage)}">${escape(t("source"))}</a></div>`);
  // Its capabilities (skills + tools), in the page's language, English where a text is missing.
  if (extension.capabilities?.length) {
    const items = extension.capabilities.map((capability) => {
      const text = capability.texts?.[lang] ?? capability.texts?.en ?? { label: capability.id };
      return `<li class="cap"><strong>${escape(text.label)}</strong>${text.description ? `<span>${escape(text.description)}</span>` : ""}</li>`;
    });
    body.insertAdjacentHTML("beforeend", `<span class="label">${escape(t("capabilities"))}</span><ul class="caps">${items.join("")}</ul>`);
  }
  const readme = document.createElement("div");
  body.append(readme);
  showReadme(extension, readme);
  const close = document.createElement("button");
  close.className = "close";
  close.type = "button";
  close.textContent = t("close");
  close.addEventListener("click", () => dialog.close());
  body.append(close);
  dialog.append(body);
  if (!dialog.open) dialog.showModal();
}
// The README as the detailed description: README.es.md in Spanish when the extension has one, else README.md.
const readmes = new Map();
const rawOf = (blob) => blob.replace(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/blob\//, "https://raw.githubusercontent.com/$1/");
async function fetchText(url) {
  if (!readmes.has(url)) readmes.set(url, fetch(asset(url)).then((response) => (response.ok ? response.text() : null)).catch(() => null));
  return readmes.get(url);
}
async function readmeFor(extension) {
  const english = extension.readme;
  const urls = lang === "en" ? [english] : [english.replace(/README\.md$/, `README.${lang}.md`), english];
  for (const blob of urls) {
    const text = await fetchText(rawOf(blob));
    if (text) return { text, blob };
  }
  return null;
}
function renderReadme({ text, blob }) {
  // Without the hero (logo, name, badges: the dialog shows them) and the signature (the page has its footer).
  const markdown = text.replace(/^\s*<div align="center">[\s\S]*?<\/div>\s*/, "").replace(/\s*<div align="center">\s*Made with[\s\S]*?<\/div>\s*$/, "");
  const box = document.createElement("div");
  box.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
  // Relative links and images, from the README's folder: images from raw files, links to GitHub.
  for (const img of box.querySelectorAll("img[src]")) img.src = asset(new URL(img.getAttribute("src"), rawOf(blob)).href);
  for (const a of box.querySelectorAll("a[href]")) {
    const href = a.getAttribute("href");
    if (href.startsWith("#")) continue;
    a.href = new URL(href, blob).href;
    a.target = "_blank";
    a.rel = "noopener";
  }
  return box.innerHTML;
}
async function showReadme(extension, target) {
  target.className = "readme loading";
  target.textContent = t("readmeLoading");
  const found = typeof marked !== "undefined" && typeof DOMPurify !== "undefined" ? await readmeFor(extension) : null;
  if (openExtension !== extension || !target.isConnected) return;
  if (!found) {
    target.className = "readme missing";
    target.textContent = t("readmeMissing");
    return;
  }
  target.className = "readme";
  target.innerHTML = renderReadme(found);
  const link = target.parentElement?.querySelector(".links a");
  if (link) link.href = found.blob;
}
function renderAdd() {
  if (!catalog.add) return;
  $("add").innerHTML = "";
  const repo = (catalog.repository ?? "").replace(/^https:\/\/github\.com\//, "");
  $("add").append(clientTabs([
    { logo: "claude", label: "Claude Code", commands: [catalog.add.claudeCode] },
    ...(repo ? [{ logo: "codex", label: "Codex", commands: [`codex plugin marketplace add ${repo}`] }] : []),
    { logo: "agentKit", label: t("agent"), commands: [`<agent> ${catalog.add.agentKit}`] },
  ]));
}
$("details").addEventListener("click", (event) => event.target === $("details") && $("details").close());
$("search").addEventListener("input", renderGrid);

async function load() {
  for (const url of ["catalog.json", "../catalog.json"]) {
    const response = await fetch(url).catch(() => null);
    if (response?.ok) return response.json();
  }
  throw new Error("No catalog.json.");
}
applyLang();
load()
  .then((loaded) => {
    catalog = loaded;
    renderAdd();
    renderChips();
    renderGrid();
  })
  .catch(() => {
    failed = true;
    renderGrid();
  });
</script>
